<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    
    <h1>University Registration Form</h1>
    <p>Please fill out the below form correctly</p>
    <hr>
    <form>

        <h2>Personal Details</h2>
        <label for="name">First Name</label>
        <input type="text" name="name" id="name" placeholder="e.g: John">
        <br><br>
         <label for="surename">Last Name</label>
        <input type="text"surename="name" id="surename" placeholder="e.g: Shah">
        <br><br>
        <label for="dob">Dob</label>
        <input type="date" name="dob" id="dob">
        <br><br>

        <label for="Male">Male</label>
        <input type="radio" name="gender" id="Male" value="Male">
        <br>
        <label for="Female">Female</label>
        <input type="radio" name="gender" id="Female" value="Female">
        <br>
        <label for="Other">Other</label>
        <input type="radio" name="gender" id="Other" value="Other">

        <br>
        <h3>Upload your photo</h3>

        <input type="file" name="file">
        <hr>

        <h2>Contact information</h2>

        <label for="Email">Emial Address</label>
        <input type="" name="" id="" placeholder="e.g: john@gmail.com">
        <br><br>
        <label for="Address">Mailing Address</label>
        <br>
        <textarea name="Address" id="Address" rows="8" cols="34"></textarea>
        <br>
        <hr>

        <h2>Academic Information</h2>

        <label for="course">Select your course</label>
        <select name="course" id="course">
            <option value="CS">CS</option>
            <option value="SE">SE</option>
            <option value="ME">ME</option>
            <option value="CE">CE</option>
        
        </select>

        <h3>Extracuricular Interests:</h3>
        <input type="checkbox" name="Interests" id="sports" value="sports">
        <label for="sports">Sports</label>

        <br>
        <input type="checkbox" name="Interests" id="music" value="music">
        <label for="music">Music & Arts</label>

        <br>
        
        <input type="checkbox" name="Interests" id="Technology" value="Technology">
        <label for="Technology">Technology</label>
        <br>
        <input type="checkbox" name="Interests" id="voluntring" value="voluntring">
         <label for="voluntring">Voluntring</label>
         <br><br>
         <hr>
         <h2>Create Your Account</h2>
         <label for="password">Create Password</label>
         <input type="password" name="password" id="password">
         <br><br>

         <label for="security">Security Question</label>
         <select name="text" id="security">
            <option value="Rabbit">Rabbit</option>
            <option value="Parrot">Parrot</option>
            <option value="Cow">Cow</option>
         
         <input type="text" name="security" id="security">
         </select>
         <br><br>
         <label for="security">Security Answer</label>
         <input type="text" name="security" id="security">

         <hr>

         <button type="submit">Register</button>
         <button type="reset">Clear Form</button>


    </form>
</body>
</html>
